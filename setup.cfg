[metadata]
name = academic-assignment-assistant
version = 0.1.0
description = A local-first, evidence-led workflow engine for academic assignments
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache-2.0
license_files = LICENSE
author = Academic Assignment Assistant contributors
classifiers =
    Development Status :: 3 - Alpha
    Environment :: Console
    License :: OSI Approved :: Apache Software License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
where = src

[options.package_data]
assignment_assistant.overlay_data = *.json

[options.entry_points]
console_scripts =
    assignment-assistant = assignment_assistant.cli:main
